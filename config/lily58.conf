# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y
# Improved antenna power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Установка яркости при включении ровно на 50%
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Выбор цвета/эффекта по умолчанию (если поддерживается темой, либо ставим режим анимации)
# По умолчанию можно включить режим перелива (например, эффект 3 или 4 в зависимости от версии ZMK)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
