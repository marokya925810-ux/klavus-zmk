# OLED экран и максимальная мощность Bluetooth
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Энкодеры
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Включение RGB подложки / диодов
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Включение диодов при старте и постоянное питание
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# Яркость 50% при запуске
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50

# Кислотно-зеленый цвет (Hue 100) и полная насыщенность (Sat 100)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=100
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100

# Режим сплошного цвета по умолчанию (Effect 0)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
